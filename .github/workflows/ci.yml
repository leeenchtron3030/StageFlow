name: Quality matrix

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.13
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: stageflow_worker_test
          POSTGRES_USER: stageflow_ci
          POSTGRES_PASSWORD: stageflow_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stageflow_ci -d stageflow_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STAGEFLOW_TEST_POSTGRES_DSN: >-
        postgresql://stageflow_ci:stageflow_ci_only@127.0.0.1:5432/stageflow_worker_test

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --dev --locked
      - name: Run backend tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run Pyright
        run: uv run pyright

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - name: Run frontend lint
        run: npm run lint
      - name: Run frontend typecheck
        run: npm run typecheck
